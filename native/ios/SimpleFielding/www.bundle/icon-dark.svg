<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Simple Fielding mark: a flat-art infield — dark-mode version, on near-black, with the ball's path
       chalked on it — hit toward left field, the start of every play in the app. -->
  <defs><linearGradient id="bgd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1C1C1E"/><stop offset="1" stop-color="#000000"/></linearGradient></defs>
  <rect width="512" height="512" fill="url(#bgd)"/>
  <g transform="translate(256 258) scale(1.3) translate(-256 -300)">
  <!-- infield dirt: base paths plus the arc behind them -->
  <path d="M256 452 L112 308 A144 144 0 0 1 400 308 Z" fill="#C9925C"/>
  <!-- infield grass -->
  <path d="M256 396 L340 312 L256 228 L172 312 Z" fill="#4EA457"/>
  <!-- home plate circle and the mound -->
  <circle cx="256" cy="420" r="30" fill="#C9925C"/>
  <circle cx="256" cy="312" r="17" fill="#C9925C"/>
  <rect x="246" y="309" width="20" height="5" rx="1.5" fill="#ffffff"/>
  <!-- foul lines -->
  <path d="M256 420 L128 292 M256 420 L384 292" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- bases -->
  <g fill="#ffffff">
    <rect x="240" y="192" width="32" height="32" rx="4" transform="rotate(45 256 208)"/>
    <rect x="334" y="288" width="32" height="32" rx="4" transform="rotate(45 350 304)"/>
    <rect x="146" y="288" width="32" height="32" rx="4" transform="rotate(45 162 304)"/>
    <path d="M238 410 h36 v18 l-18 16 l-18 -16 z"/>
  </g>
  <!-- the ball: dotted chalk from home plate toward left field -->
  <path d="M246 404 L166 212" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-dasharray="1 22"/>
  <circle cx="160" cy="198" r="12" fill="none" stroke="#ffffff" stroke-width="7"/>
  </g>
</svg>
