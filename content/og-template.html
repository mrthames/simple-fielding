<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(160deg, #142a4f, #0b1c3a); color: #fff; display: flex; align-items: center;
    padding: 0 80px; box-sizing: border-box; gap: 60px;
  }
  .text { flex: 1; }
  .kicker { display: inline-block; background: rgba(255,255,255,.14); border-radius: 999px; padding: 8px 18px; font-size: 26px; font-weight: 700; color: #dbe6ff; }
  h1 { font-family: 'DM Serif Display', Georgia, serif; font-weight: 400; font-size: 68px; line-height: 1.08; letter-spacing: 0; margin: 26px 0 30px; }
  .brand { font-size: 30px; font-weight: 700; color: #FFCC00; }
  img { width: 360px; height: 360px; border-radius: 80px; box-shadow: 0 30px 60px rgba(0,0,0,.35); }
</style></head>
<body><div class="text"><span class="kicker">{{KICKER}}</span><h1>{{TITLE}}</h1><div class="brand">simplefielding.com</div></div><img src="{{ICON}}" alt=""></body></html>
