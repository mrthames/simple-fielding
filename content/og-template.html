<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #142a4f, #0b1c3a); color: #fff; display: flex; align-items: center;
    padding: 0 80px; box-sizing: border-box; gap: 60px;
  }
  .text { flex: 1; }
  .kicker { display: inline-block; background: rgba(255,255,255,.14); border-radius: 999px; padding: 8px 18px; font-size: 26px; font-weight: 700; color: #dbe6ff; }
  h1 { font-size: 64px; line-height: 1.08; letter-spacing: -1.5px; margin: 26px 0 30px; }
  .brand { font-size: 30px; font-weight: 800; color: #FFCC00; }
  img { width: 360px; height: 360px; border-radius: 80px; box-shadow: 0 30px 60px rgba(0,0,0,.35); }
</style></head>
<body><div class="text"><span class="kicker">{{KICKER}}</span><h1>{{TITLE}}</h1><div class="brand">simplefielding.com</div></div><img src="{{ICON}}" alt=""></body></html>
