name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nothing personal in the repository
        run: bash tools/check-for-personal-data.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Engine tests
        run: node --test tests/*.test.js

      # Rebuilds the guides. Every "Watch this play" in an article is run through the engine and must
      # match what the article says; the committed pages must also be up to date.
      - name: Guides agree with the engine
        run: |
          node scripts/build-site.mjs
          git diff --exit-code -- website ':!website/sitemap.xml'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: UI tests
        run: npx playwright test

      # Every play at every level: what its name and summary say must match what the clock decides.
      # Known, correct exceptions are listed with their reasons in tests/audit-expected.json.
      - name: Plays say what happens
        run: npm run audit

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
